---

want_sshd: yes
want_sshguard: yes


sshd_package:
  - openssh-server

sshd_service_name: sshd

sshd_config_file: /etc/ssh/sshd_config
sshd_config_d: /etc/ssh/sshd_config.d

sshd_directories:
  - path: "{{ sshd_config_file }}"
    owner: "root"
    group: "{{ root_group }}"
    mode: "0644"
    state: "file"
  - path: "{{ sshd_config_d }}"
    owner: "root"
    group: "{{ root_group }}"
    mode: "0755"

sshd_connection_groups:
  - name: sshusers
    gid: 2099

sshd_per_source_penalty_noauth: 5s
sshd_per_source_penalty_grace_exceeded: 20s
sshd_per_source_penalty_authfail: 10s
sshd_per_source_penalty_refuseconnection: 60s
sshd_per_source_penalty_min: 30s
sshd_per_source_penalty_max: 1h
sshd_per_source_penalty_exempt_list: []

sshd_conf_deny_users:
  - root
sshd_conf_deny_groups:
  - root
sshd_conf_allow_users: []
sshd_conf_allow_groups: "{{ sshd_connection_groups | map(attribute='name') | list }}"

sshd_config_d_01_hardening:
  name: "01-hardening"
  settings:
    - name: PermitRootLogin
      value: "no"
    - name: PermitEmptyPasswords
      value: "no"
    - name: PermitUserEnvironment
      value: "no"
    - name: PasswordAuthentication
      value: "no"
      when: "{{ want_max_security | d(false) }}"
    - name: ChallengeResponseAuthentication
      value: "no"
      when: "{{ want_max_security | d(false) }}"
    - name: UsePAM
      value: "no"
      when: "{{ want_max_security | d(false) }}"
    - name: PubkeyAuthentication
      value: "yes"
    - name: MaxAuthTries
      value: 3
    - name: X11Forwarding
      value: "no"
    - name: AllowTcpForwarding
      value: "no"
    # - name: Ciphers
    #   value: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com"
    # - name: KexAlgorithms
    #   value: "curve25519-sha256@libssh.org,sntrup761x25519-sha512@openssh.com"
    # - name: MACs
    #   value: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com"
    # - name: HostKey
    #   value: /etc/ssh/ssh_host_ed25519_key
    - name: ClientAliveInterval
      value: 300
    - name: ClientAliveCountMax
      value: 3
    - name: LogLevel
      value: VERBOSE
      when: "{{ want_max_security | d(false) }}"
    - name: PerSourcePenalties
      value: "noauth:{{ sshd_per_source_penalty_noauth }} grace-exceeded:{{ sshd_per_source_penalty_grace_exceeded }} authfail:{{ sshd_per_source_penalty_authfail }} refuseconnection:{{ sshd_per_source_penalty_refuseconnection }} min:{{ sshd_per_source_penalty_min }} max:{{ sshd_per_source_penalty_max }}"
    - name: PerSourcePenaltyExemptList
      value: "{{ sshd_per_source_penalty_exempt_list | join(', ') }}"

sshd_config_d_10_access:
  name: "10-access"
  settings:
    - name: DenyUsers
      value: "{{ sshd_conf_deny_users | join(' ') }}"
    - name: DenyGroups
      value: "{{ sshd_conf_deny_groups | join(' ') }}"
    - name: AllowUsers
      value: "{{ sshd_conf_allow_users | join(' ') }}"
    - name: AllowGroups
      value: "{{ sshd_conf_allow_groups | join(' ') }}"

sshd_config_d_files:
  - "{{ sshd_config_d_01_hardening }}"
  - "{{ sshd_config_d_10_access }}"


sshd_sshguard_package:
  - sshguard

sshd_sshguard_conf_dir: /etc/sshguard
sshd_sshguard_conf: "{{ sshd_sshguard_conf_dir }}/sshguard.conf"
sshd_sshguard_conf_whitelist: "{{ sshd_sshguard_conf_dir }}/whitelist"
sshd_sshguard_files:
  - path: "{{ sshd_sshguard_conf_dir }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0750"
  - path: "{{ sshd_sshguard_conf }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0640"
    state: file
  - path: "{{ sshd_sshguard_conf_whitelist }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0640"
    state: file

sshd_sshguard_settings:
  - name: THRESHOLD
    value: 100
  - name: BLOCK_TIME
    value: 1800
  - name: DETECTION_TIME
    value: 43200
  - name: WHITELIST_FILE
    value: "{{ sshd_sshguard_conf_whitelist }}"

sshd_sshguard_whitelist:
  - '127.0.0.1'
  - '::1'
# sshd_sshguard_whitelist: "{{ (['127.0.0.1', '::1'] + ansible_facts.all_ipv4_addresses + ansible_facts.all_ipv6_addresses) | unique }}"

sshd_sshguard_service_name: sshguard



root_group: root
