---

sshd_sshguard_package:
  - sshguard

sshd_sshguard_conf_dir: /etc/sshguard
sshd_sshguard_conf: "{{ sshd_sshguard_conf_dir }}/sshguard.conf"
sshd_sshguard_conf_whitelist: "{{ sshd_sshguard_conf_dir }}/whitelist"
sshd_sshguard_files:
  - path: "{{ sshd_sshguard_conf_dir }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0750"
  - path: "{{ sshd_sshguard_conf }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0640"
    state: file
  - path: "{{ sshd_sshguard_conf_whitelist }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0640"
    state: file

sshd_sshguard_settings:
  - name: THRESHOLD
    value: 100
  - name: BLOCK_TIME
    value: 1800
  - name: DETECTION_TIME
    value: 43200
  - name: WHITELIST_FILE
    value: "{{ sshd_sshguard_conf_whitelist }}"

sshd_sshguard_whitelist:
  - '127.0.0.1'
  - '::1'
# sshd_sshguard_whitelist: "{{ (['127.0.0.1', '::1'] + ansible_facts.all_ipv4_addresses + ansible_facts.all_ipv6_addresses) | unique }}"

sshd_sshguard_service_name: sshguard
