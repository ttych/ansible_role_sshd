---

- name: install sshguard package
  ansible.builtin.package:
    name: "{{ sshd_sshguard_package }}"
    state: present
  register: t_sshd_sshguard_package



- name: ensure conf permissions
  ansible.builtin.file:
    path: "{{ item.path | d(omit) }}"
    owner: "{{ item.owner | d(omit) }}"
    group: "{{ item.group | d(omit) }}"
    mode: "{{ item.mode | d(omit) }}"
    state: "{{ item.state|d('directory') }}"
  loop: "{{ sshd_sshguard_files }}"


- name: configure sshguard
  ansible.builtin.lineinfile:
    path: "{{ sshd_sshguard_conf }}"
    regexp: "^{{ sshd_sshguard_setting.name }}="
    line: "{{ sshd_sshguard_setting.name }}={{ sshd_sshguard_setting.value }}"
    state: "{{ sshd_sshguard_setting.state | d('present') }}"
    backrefs: "{{ sshd_sshguard_setting.backrefs | d(false) }}"
    insertafter: "{{ sshd_sshguard_setting.insertafter | d('^#\\s*' + sshd_sshguard_setting.name + '=') }}"
    create: yes
  when:
    - sshd_sshguard_setting.when | d(true)
    - sshd_sshguard_setting.value not in [none, '']
  loop: "{{ sshd_sshguard_settings }}"
  loop_control:
    loop_var: sshd_sshguard_setting
  register: t_sshd_sshguard_settings

- name: configure whitelist
  ansible.builtin.lineinfile:
    path: "{{ sshd_sshguard_conf_whitelist }}"
    regexp: "^{{ sshd_sshguard_whitelist_item }}"
    line: "{{ sshd_sshguard_whitelist_item }}"
    create: yes
  when:
    - sshd_sshguard_whitelist_item not in [none, '']
  loop: "{{ sshd_sshguard_whitelist }}"
  loop_control:
    loop_var: sshd_sshguard_whitelist_item
  register: t_sshd_sshguard_whitelist



- name: enable sshguard service
  ansible.builtin.service:
    name: "{{ sshd_sshguard_service_name }}"
    enabled: yes

- name: start sshguard service
  ansible.builtin.service:
    name: "{{ sshd_sshguard_service_name }}"
    state: started
  register: t_sshd_sshguard_service_start

- name: restart sshguard service on change
  ansible.builtin.service:
    name: "{{ sshd_sshguard_service_name }}"
    state: restarted
  when:
    - not t_sshd_sshguard_service_start.changed
    - t_sshd_sshguard_settings.changed or t_sshd_sshguard_whitelist.changed
